[project]
name = "cyberremediate360"
version = "1.0.0"
description = "Vulnerability & cyber-risk management platform (FastAPI + SQLite + Streamlit)"
requires-python = ">=3.11,<3.12"
readme = "README.md"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend", "scripts", "tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning:reportlab.*"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["scripts/legacy", "data", "reports"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "A", "BLE", "ARG"]
ignore = ["B008", "S101", "S311"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "ARG001", "S608"]
"backend/migrations/*" = ["S608", "E501"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

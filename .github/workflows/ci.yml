name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Ruff format check
        run: ruff format --check backend frontend scripts tests
      - name: Ruff lint
        run: ruff check backend frontend scripts tests
      - name: Pytest
        run: pytest -o addopts="" --cov=backend/app --cov-report=term-missing
      - name: Smoke - migrate and seed demo database
        run: python scripts/seed_demo.py
